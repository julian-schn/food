id: pot-roast-roemertopf
title: Pot Roast (amerikanischer Rinderbraten) im Römertopf
lang: de
description: Schmorbraten mit Möhren und Kartoffeln im selben Topf, angepasst für Römertopf statt Bräter.
source:
  type: adapted
  url: https://julchen-kocht.de/pot-roast-amerikanischer-rinderbraten-vom-feinsten/
  credit: Julchen kocht
servings: 6
time:
  active: 30
  passive: 210
tags:
  course: [main]
  cuisine: [american]
  protein: [beef]
  method: [sear, braise]
  equipment: [stovetop, oven, roemertopf]
  effort: medium
  season: [autumn, winter]
  mood: [comfort, crowd, meal-prep]
ingredients:
  - id: rind
    name: Rinderbraten (Zungenstück, alternativ Keule oder Schulter)
    amount: 1.5
    unit: kg
  - id: zwiebeln
    name: Zwiebeln
    amount: 3
    unit: piece
  - id: knoblauch
    name: Knoblauchzehen
    amount: 2
    unit: piece
  - id: moehren
    name: Möhren
    amount: 5
    unit: piece
  - id: kartoffeln
    name: Kartoffeln, festkochend (z.B. Drillinge)
    amount: 500
    unit: g
  - id: fond
    name: Rinderfond oder -brühe
    amount: 750
    unit: ml
  - id: tomatenmark
    name: Tomatenmark
    amount: 1
    unit: tbsp
  - id: ruebensirup
    name: Rübensirup
    amount: 1
    unit: tbsp
  - id: paprika
    name: Paprika edelsüß
    amount: 2
    unit: tsp
  - id: salz_pfeffer
    name: Salz und Pfeffer
    amount: null
    unit: to-taste
  - id: rosmarin
    name: Rosmarinzweige
    amount: 3
    unit: piece
  - id: staerke
    name: Speisestärke, in Wasser aufgelöst
    amount: 2
    unit: tsp
  - id: petersilie
    name: Petersilie, gehackt
    amount: 15
    unit: g
  - id: oel
    name: Öl zum Anbraten
    amount: 2
    unit: tbsp
steps:
  - title: Römertopf wässern
    text: Topf und Deckel 10-15 Minuten in kaltes Wasser legen.
    timer: 900
  - title: Vorbereiten
    text: '{rind} in 4 gleich große Stücke. {zwiebeln} und {knoblauch} klein schneiden, {moehren} in mundgerechte Stücke, {kartoffeln} und {rosmarin} säubern.'
  - title: Fleisch anbraten
    text: In einer Pfanne in {oel} von allen Seiten scharf anbraten, mit {salz_pfeffer} und {paprika} würzen, in den Römertopf legen.
    heat: 8
    timer: 480
  - title: Zwiebeln anschwitzen
    text: Zwiebeln und Knoblauch in derselben Pfanne glasig anschwitzen, {ruebensirup} und {tomatenmark} kurz mitrösten.
    heat: 5
    timer: 300
  - title: Ablöschen und einschichten
    text: Mit {fond} ablöschen, Bratensatz lösen, alles zum Fleisch in den Römertopf. Möhren, Kartoffeln und Rosmarin dazu.
  - title: Schmoren
    text: Deckel drauf, Römertopf in den KALTEN Ofen stellen, dann erst einschalten. 3-3,5 Stunden bis das Fleisch zerfällt. Nie in den vorgeheizten Ofen, der Ton reißt.
    oven: {temp_c: 185, mode: ober-unter}
    timer: 11700
  - title: Sauce binden
    text: Rosmarin raus, Flüssigkeit in einen Topf abgießen, auf dem Herd mit {staerke} kurz aufkochen bis sie eindickt. Nicht im Römertopf.
    heat: 7
    timer: 180
  - title: Anrichten
    text: Mit {petersilie} bestreuen.
notes: >-
  Original: ofenfester Bräter, 160°C Umluft vorgeheizt, 3h. Hier für Römertopf umgebaut
  (180-190°C Ober-/Unterhitze wegen Kaltstart). Ohne Römertopf: Auflaufform, fest mit Alufolie
  abdecken. Petersilie im Original 1/2 cup, ca. 15 g. Festkochende Kartoffeln zerfallen nicht,
  alternativ Kartoffeln und Möhren erst nach 90 Minuten zugeben.
