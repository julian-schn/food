{% from "_macros.html" import tt %}
<!doctype html>
<html lang="de" data-lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Rezepte{% endblock %}</title>
<meta name="description" content="{% block description %}Rezeptsammlung · recipe collection{% endblock %}">
<meta name="color-scheme" content="light">
{% if SITE_URL and social %}<meta property="og:image" content="{{ SITE_URL }}static/{{ social }}">{% endif %}
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 12 12' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='4' height='4' fill='%231f4fe0'/><rect x='4' y='0' width='4' height='4' fill='%236b93ff'/><rect x='8' y='0' width='4' height='4' fill='%231f4fe0'/><rect x='0' y='4' width='4' height='4' fill='%236b93ff'/><rect x='4' y='4' width='4' height='4' fill='%231f4fe0'/><rect x='8' y='4' width='4' height='4' fill='%231f4fe0'/><rect x='0' y='8' width='4' height='4' fill='%231f4fe0'/><rect x='4' y='8' width='4' height='4' fill='%231f4fe0'/><rect x='8' y='8' width='4' height='4' fill='%236b93ff'/></svg>">
<script>
  // Set the language before first paint so the other one never flashes.
  (function () {
    var l = null;
    try { l = localStorage.getItem("lang"); } catch (e) {}
    if (l !== "de" && l !== "en") l = /^de\b/i.test(navigator.language || "") ? "de" : "en";
    document.documentElement.dataset.lang = l;
    document.documentElement.lang = l;
  })();
</script>
<link rel="preload" href="{{ root }}static/fonts/inter-tight-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ root }}static/style.css">
<script src="{{ root }}static/app.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="site-header">
  <a class="brand" href="{{ root }}">{% include "_mark.html" %}{{ tt("Rezepte", "Recipes") }}</a>
  <div class="lang-switch" role="group" aria-label="Sprache / Language">
    <button type="button" data-set-lang="de" lang="de">DE</button>
    <button type="button" data-set-lang="en" lang="en">EN</button>
  </div>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
